name: Docker-Image Weissenberge CI für GHCR

on:
  push

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bild erstellen
        run: docker build . --tag ghcr.io/surmatik/webseite-weissenberge:latest
      - name: Bei GHCR anmelden und veröffentlichen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/surmatik/webseite-weissenberge:latest